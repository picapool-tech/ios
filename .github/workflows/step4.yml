name: Finally Releasing IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    env:
      P12_FILE_BASE64:        ${{ secrets.P12_FILE_BASE64 }}
      P12_PASSWORD:           ${{ secrets.P12_PASSWORD }}
      MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
      TEAM_ID:                ${{ secrets.TEAM_ID }}
      BUNDLE_ID:              ${{ secrets.BUNDLE_ID }}
      PROFILE_UUID:           222426f2-573a-42bc-a199-e0f309dc3670

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.7'

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods xcpretty
          pod repo update

      - name: Flutter clean
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Install iOS dependencies
        run: |
          cd ios
          cp Podfile.test Podfile
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..

      # ---------------- Signing Setup ----------------
      - name: Decode & Install Signing Assets
        run: |
          echo "$P12_FILE_BASE64"        | base64 --decode > cert.p12
          echo "$MOBILEPROVISION_BASE64" | base64 --decode > profile.mobileprovision

          security create-keychain -p temp_pw signing.keychain
          security unlock-keychain  -p temp_pw signing.keychain
          security import cert.p12 -k signing.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s signing.keychain login.keychain

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision

          echo "✅ P12 & mobileprovision installed."

      - name: Debug Signing Info
        run: |
          echo "=== Available Identities ==="
          security find-identity -v -p codesigning
          echo "=== Installed Provisioning Profiles ==="
          ls -lh ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "=== Extracting Profile Details ==="
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision | grep -A2 UUID || true
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision | grep -A2 application-identifier || true

      # ---------------- Build ----------------
      - name: Build iOS (Unsigned)
        run: flutter build ios --release --no-codesign -t lib/test_app.dart

      - name: Archive Runner
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
          -scheme Runner \
          -sdk iphoneos \
          -configuration Release \
          archive -archivePath build/ios/Runner.xcarchive \
          -xcconfig ios/signing.xcconfig \
          CODE_SIGN_STYLE=Manual

      - name: Debug Xcode Build Settings
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
          -scheme Runner \
          -configuration Release \
          -showBuildSettings | grep -E 'PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER'

      # ---------------- Export IPA ----------------
      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
          -archivePath build/ios/Runner.xcarchive \
          -exportOptionsPlist ios/Runner/ExportOptions.plist \
          -exportPath build/ios/ipa \
          -verbose

      - name: Show IPA
        run: ls -lh build/ios/ipa
