name: Finally Releasing IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    env:
      P12_FILE_BASE64:        ${{ secrets.P12_FILE_BASE64 }}
      P12_PASSWORD:           ${{ secrets.P12_PASSWORD }}
      MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
      TEAM_ID:                ${{ secrets.TEAM_ID }}
      BUNDLE_ID:              ${{ secrets.BUNDLE_ID }}
      PROFILE_UUID:           23ca837c-3da0-4490-89e1-e74de0f7d55a

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.7'

      - name: Install CocoaPods
        run: |
          set -x
          sudo gem install cocoapods xcpretty
          pod repo update

      - name: Flutter clean
        run: |
          set -x
          flutter clean

      - name: Get dependencies
        run: |
          set -x
          flutter pub get

      - name: Install iOS dependencies
        run: |
          set -x
          cd ios
          cp Podfile.test Podfile
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..

      # ---------------- Signing Setup ----------------
      - name: Decode & Install Signing Assets
        run: |
          set -x
          echo "$P12_FILE_BASE64"        | base64 --decode > cert.p12
          echo "$MOBILEPROVISION_BASE64" | base64 --decode > profile.mobileprovision

          security create-keychain -p temp_pw signing.keychain
          security unlock-keychain  -p temp_pw signing.keychain
          security import cert.p12 -k signing.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s signing.keychain login.keychain

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision

          echo "✅ P12 & mobileprovision installed."

      - name: Debug Signing Info
        run: |
          set -x
          echo "=== Available Identities ==="
          security find-identity -v -p codesigning
          echo "=== Installed Provisioning Profiles ==="
          ls -lh ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "=== Extracting Profile Details ==="
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision | grep -A2 UUID || true
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision | grep -A2 application-identifier || true

      # ---------------- Build ----------------
      - name: Build iOS (Unsigned)
        run: |
          set -x
          flutter build ios --release --no-codesign -t lib/test_app.dart

      - name: Archive Runner (Unsigned)
        run: |
          set -x
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            archive -archivePath build/ios/Runner.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: Embed Provisioning Profile
        run: |
          set -x
          echo "Embedding provisioning profile into Runner.app"
          cp ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision \
             build/ios/Runner.xcarchive/Products/Applications/Runner.app/embedded.mobileprovision

      - name: Manual Code Signing
        run: |
          set -x
          echo "Manually signing Runner.app..."
          SIGN_ID=$(security find-identity -v -p codesigning | grep "Apple Distribution" | head -n 1 | cut -d '"' -f2)
          echo "Using Signing Identity: $SIGN_ID"
          codesign --force --sign "$SIGN_ID" \
            --entitlements ios/Runner/Runner.entitlements \
            build/ios/Runner.xcarchive/Products/Applications/Runner.app
          codesign --verify --deep --strict build/ios/Runner.xcarchive/Products/Applications/Runner.app || echo "Codesign verify failed"

      - name: Debug Build Settings
        run: |
          set -x
          echo "=== First 100 lines of Build Settings ==="
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -showBuildSettings | head -n 100

      - name: Check Embedded Provisioning Profile
        run: |
          set -x
          echo "=== Checking embedded.mobileprovision inside xcarchive ==="
          ls -lh build/ios/Runner.xcarchive/Products/Applications/Runner.app/ | grep mobileprovision || echo "No embedded.mobileprovision found"
          security cms -D -i build/ios/Runner.xcarchive/Products/Applications/Runner.app/embedded.mobileprovision || echo "No profile found"

      - name: Inspect Archive Before Export
        run: |
          set -x
          echo "=== Listing xcarchive Contents ==="
          ls -R build/ios/Runner.xcarchive | head -n 50
          echo "=== Info.plist from archive ==="
          cat build/ios/Runner.xcarchive/Info.plist || echo "No Info.plist"
      
      - name: Install coreutils (for timeout)
        run: |
          set -x
          brew install coreutils

      # ---------------- Export IPA ----------------
      - name: Export IPA (Debug Mode)
        run: |
          set -o pipefail
          gtimeout 25m xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportOptionsPlist ios/Runner/ExportOptions.plist \
            -exportPath build/ios/ipa \
            -allowProvisioningUpdates \
            -verbose | tee export_debug.log || true

      - name: Show Export Logs
        if: always()
        run: |
          echo "=== Export Debug Log ==="
          cat export_debug.log || echo "No export_debug.log found"

      - name: Show IPA
        if: always()
        run: ls -lh build/ios/ipa || echo "IPA not generated."
