name: signing‑sanity

on:
  push:
    branches: [ under_dev ]   # remove if you only want manual runs
  workflow_dispatch:

jobs:
  sign-test:
    runs-on: macos-14
    env:
      P12_FILE_BASE64:        ${{ secrets.P12_FILE_BASE64 }}
      MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
      P12_PASSWORD:           ${{ secrets.P12_PASSWORD }}

    steps:
    - name: Decode P12 & profile
      run: |
        echo "$P12_FILE_BASE64"        | base64 --decode > cert.p12
        echo "$MOBILEPROVISION_BASE64" | base64 --decode > profile.mobileprovision
        ls -lh cert.p12 profile.mobileprovision

    - name: OpenSSL password check
      run: |
        openssl pkcs12 -in cert.p12 -nokeys -passin pass:"$P12_PASSWORD"

    - name: Keychain import
      run: |
        security create-keychain -p tmp_pw signing.keychain
        security unlock-keychain  -p tmp_pw signing.keychain
        security import cert.p12 \
          -k signing.keychain \
          -P "$P12_PASSWORD" \
          -T /usr/bin/codesign -T /usr/bin/security \
          || (echo "⛔️ import failed" && exit 1)
        echo "✅ keychain import OK"
