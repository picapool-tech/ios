name: Build & Upload to TestFlight

on:
  push:
    branches: [ under_dev ]      # ← auto‐run only here
    tags:     [ 'v*' ]           # optional: push a tag like v3.2.1
  workflow_dispatch:             # manual run

jobs:
  ios-release:
    runs-on: macos-14

    env:                          # single source of truth
      FLUTTER_VERSION: 3.32.7
      P12_FILE_BASE64:        ${{ secrets.P12_FILE_BASE64 }}
      P12_PASSWORD:           ${{ secrets.P12_PASSWORD }}
      MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
      ISSUER_ID:              ${{ secrets.APP_STORE_ISSUER_ID }}
      KEY_ID:                 ${{ secrets.APP_STORE_KEY_ID }}
      API_KEY_P8:             ${{ secrets.APP_STORE_KEY_P8 }}

    steps:
    # 1) Checkout
    - uses: actions/checkout@v3

    # 2) Flutter toolchain
    - name: Install Flutter
      uses: subosito/flutter-action@v2
      with: { flutter-version: ${{ env.FLUTTER_VERSION }} }

    - name: Flutter pub get
      run: |
        flutter pub get

    # 3) CocoaPods
    - run: |
        cd ios
        pod install --repo-update
        cd ..

    # 4) Import signing assets (certificate + profile)
    - name: Import signing certificate
      uses: apple-actions/import-codesign-certs@v2
      with:
        p12-file-base64: ${{ env.P12_FILE_BASE64 }}
        p12-password:    ${{ env.P12_PASSWORD }}

    - name: Install provisioning profile
      run: |
        echo "$MOBILEPROVISION_BASE64" | base64 --decode > profile.mobileprovision
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

    # 5) Build IPA
    - name: Build release IPA
      run: |
        flutter build ipa --release \
          --export-options-plist=ios/Runner/ExportOptions.plist

    # 6) Upload to TestFlight
    - name: Upload to TestFlight
      uses: apple-actions/upload-testflight-build@v1
      with:
        app-path: build/ios/ipa/*.ipa
        issuer-id:       ${{ env.ISSUER_ID }}
        api-key-id:      ${{ env.KEY_ID }}
        api-private-key: ${{ env.API_KEY_P8 }}
