name: iOS signing‑sanity check   # ► DOES NOT build Flutter, only tests signing

# ─────────── triggers ───────────
on:
  push:                       # ← auto‑run on every push to under_dev
    branches: [ under_dev ]
  workflow_dispatch:          # ← manual run button in Actions tab
    inputs:
      note:
        description: "Optional note for this run"
        required: false
        default: "ad‑hoc signing test"

jobs:
  signing-test:
    runs-on: macos-14

    steps:
    # 1. Short fingerprints of the secrets (masked)
    - name: Show secrets‑fingerprint
      shell: bash
      run: |
        echo "ISSUER_ID  : ${APP_STORE_ISSUER_ID:0:8}…"
        echo "KEY_ID     : ${APP_STORE_KEY_ID:0:8}…"
        echo "P12_BASE64 : $(echo $P12_FILE_BASE64 | head -c 8)…"
        echo "PROV_BASE  : $(echo $MOBILEPROVISION_BASE64 | head -c 8)…"
        echo "P12_PASS   : $(echo $P12_PASSWORD | head -c 1)******"
      env:
        APP_STORE_ISSUER_ID:    ${{ secrets.APP_STORE_ISSUER_ID }}
        APP_STORE_KEY_ID:       ${{ secrets.APP_STORE_KEY_ID }}
        P12_FILE_BASE64:        ${{ secrets.P12_FILE_BASE64 }}
        MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        P12_PASSWORD:           ${{ secrets.P12_PASSWORD }}

    # 2. Decode the two binary blobs
    - name: Decode files
      run: |
        echo "$P12_FILE_BASE64"        | base64 --decode > cert.p12
        echo "$MOBILEPROVISION_BASE64" | base64 --decode > profile.mobileprovision
        ls -lh cert.p12 profile.mobileprovision
      env:
        P12_FILE_BASE64:        ${{ secrets.P12_FILE_BASE64 }}
        MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}

    # 3. Check that the password really opens the P12 (OpenSSL)
    - name: Test P12 password with OpenSSL
      run: |
        echo "🔐  Testing P12 password with OpenSSL…"
        openssl pkcs12 -in cert.p12 -nokeys -passin pass:"$P12_PASSWORD"
      env:
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}

    # 4. Import certificate into a temporary keychain
    - name: Import into temporary keychain
      run: |
        security create-keychain -p temp_pw signing_temp.keychain
        security set-keychain-settings -lut 21600 signing_temp.keychain
        security unlock-keychain -p temp_pw signing_temp.keychain

        echo "🗝  Importing P12 with security…"
        security import cert.p12 \
          -k signing_temp.keychain \
          -P "$P12_PASSWORD" \
          -T /usr/bin/codesign -T /usr/bin/security \
          || (echo '⛔️ security import FAILED' && exit 1)

        echo "✅ security import succeeded!"
      env:
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
