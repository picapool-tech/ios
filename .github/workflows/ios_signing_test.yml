name: Build & Upload to TestFlight

on:
  push:
    branches: [ under_dev ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  ios-release:
    runs-on: macos-14
    env:
      FLUTTER_VERSION: 3.32.7
      P12_FILE_BASE64:        ${{ secrets.P12_FILE_BASE64 }}
      P12_PASSWORD:           ${{ secrets.P12_PASSWORD }}
      MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
      ISSUER_ID:              ${{ secrets.APP_STORE_ISSUER_ID }}
      KEY_ID:                 ${{ secrets.APP_STORE_KEY_ID }}
      API_KEY_P8:             ${{ secrets.APP_STORE_KEY_P8 }}
      BUNDLE_ID:              com.picapool
      TEAM_ID:                34R325V59A

    steps:
    # 1. Checkout
    - uses: actions/checkout@v3

    # 2. Install Flutter
    - name: Install Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}

    - name: Flutter pub get
      run: flutter pub get

    # 3. Patch Podfile to fix Firebase Swift issue
    - name: Patch Podfile for Firebase
      run: |
        cd ios
        echo "Patching Podfile for stable Firebase versions..."
        sed -i '' '/pod "Firebase\/Auth"/d' Podfile || true
        sed -i '' '/pod "Firebase\/Firestore"/d' Podfile || true
        sed -i '' '/pod "Firebase\/Storage"/d' Podfile || true
        echo 'pod "Firebase/Auth", ">= 10.24.0", "< 11.0"' >> Podfile
        echo 'pod "Firebase/Firestore", ">= 10.24.0", "< 11.0"' >> Podfile
        echo 'pod "Firebase/Storage", ">= 10.24.0", "< 11.0"' >> Podfile
        cat Podfile
        cd ..

    # 4. CocoaPods
    - name: Install CocoaPods
      run: |
        cd ios
        pod repo update
        pod install --repo-update
        cd ..

    # 5. Import signing certificate
    - name: Import signing certificate
      uses: apple-actions/import-codesign-certs@v2
      with:
        p12-file-base64: ${{ env.P12_FILE_BASE64 }}
        p12-password:    ${{ env.P12_PASSWORD }}

    # 6. Install provisioning profile
    - name: Install provisioning profile
      run: |
        echo "$MOBILEPROVISION_BASE64" | base64 --decode > profile.mobileprovision
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
        echo "Provisioning profile installed"
        security cms -D -i profile.mobileprovision | grep -A1 ApplicationIdentifierPrefix

    # 7. Build IPA
    - name: Build IPA
      run: |
        flutter build ipa --release \
          --export-options-plist=ios/Runner/ExportOptions.plist

    # 8. Upload to TestFlight
    - name: Upload to TestFlight
      uses: apple-actions/upload-testflight-build@v1
      with:
        app-path: build/ios/ipa/*.ipa
        issuer-id:       ${{ env.ISSUER_ID }}
        api-key-id:      ${{ env.KEY_ID }}
        api-private-key: ${{ env.API_KEY_P8 }}
