name: signing‑sanity

on:
  push:
    branches: [ under_dev ]   # comment this out if you only want manual
  workflow_dispatch:

jobs:
  sign-test:
    runs-on: macos-14
    env:
      P12:  ${{ secrets.P12_FILE_BASE64 }}
      PROV: ${{ secrets.MOBILEPROVISION_BASE64 }}
      PW:   ${{ secrets.P12_PASSWORD }}

    steps:
    - name: Decode artefacts
      run: |
        echo "$P12"  | base64 --decode > cert.p12
        echo "$PROV" | base64 --decode > profile.mobileprovision
        ls -lh cert.p12 profile.mobileprovision

    - name: OpenSSL password check
      run: |
        openssl pkcs12 -in cert.p12 -nokeys -passin pass:"$PW"

    - name: Keychain import (legacy P12 should succeed)
      run: |
        security create-keychain -p tmp_pw signing.keychain
        security unlock-keychain -p tmp_pw signing.keychain
        security import cert.p12 \
          -k signing.keychain \
          -P "$PW" \
          -T /usr/bin/codesign -T /usr/bin/security  \
          || (echo '⛔️ keychain import FAILED' && exit 1)
        echo "✅ keychain import OK"
