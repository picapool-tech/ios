name: Release IPA

on:
  #push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    env:
      P12_FILE_BASE64:        ${{ secrets.P12_FILE_BASE64 }}
      P12_PASSWORD:           ${{ secrets.P12_PASSWORD }}
      MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
      TEAM_ID:                ${{ secrets.TEAM_ID }}
      BUNDLE_ID:              ${{ secrets.BUNDLE_ID }}
      PROFILE_NAME:           Picapool_AppStore_Profile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.7'

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod repo update

      - name: Flutter clean
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Install iOS dependencies
        run: |
          cd ios
          cp Podfile.test Podfile
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..

      # ---------------- Signing Setup ----------------
      - name: Decode & Install Signing Assets
        run: |
          echo "$P12_FILE_BASE64"        | base64 --decode > cert.p12
          echo "$MOBILEPROVISION_BASE64" | base64 --decode > profile.mobileprovision

          # Setup Keychain
          security create-keychain -p temp_pw signing.keychain
          security unlock-keychain  -p temp_pw signing.keychain
          security import cert.p12 -k signing.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s signing.keychain login.keychain
          security set-keychain-settings signing.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k temp_pw signing.keychain

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

          echo "✅ P12 & mobileprovision installed."

      - name: Debug Signing Info
        run: |
          security find-identity -v -p codesigning
          ls -lh ~/Library/MobileDevice/Provisioning\ Profiles/

      # ---------------- Build + Archive ----------------
      - name: Build iOS (Unsigned)
        run: flutter build ios --release --no-codesign -t lib/test_app.dart

      - name: Archive Runner (Signed)
        run: |
            xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            archive -archivePath build/ios/Runner.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution"

      # ---------------- Export IPA ----------------
      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportOptionsPlist ios/Runner/ExportOptions.plist \
            -exportPath build/ios/ipa \
            -allowProvisioningUpdates \
            -verbose

      - name: Show IPA
        run: ls -lh build/ios/ipa || echo "IPA not generated."
