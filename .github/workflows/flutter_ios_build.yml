name: Build iOS IPA and Upload to TestFlight

# Triggers for this workflow
on:
  workflow_dispatch:          # Allows manual runs from GitHub Actions UI
  push:
    branches:
      - under_dev             # Runs automatically on push to "under_dev" branch
    tags:
      - 'v*'                  # Runs when a tag like v3.2.1 is pushed

jobs:
  build:
    runs-on: macos-14         # Use macOS 14 runner (stable and Xcode 15.x)

    steps:
      # STEP 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # STEP 2: Print which branch triggered this workflow (debugging)
      - name: Print current branch
        run: |
          echo "Triggered from branch: $GITHUB_REF"

      # STEP 3: Show system information (macOS version, Xcode version)
      - name: Show System Info
        run: |
          echo "==== SYSTEM INFO ===="
          sw_vers
          xcodebuild -version

      # STEP 4: Install Flutter (specific version to match your local setup)
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.7'  # Ensure this matches your local version

      # STEP 5: Show Flutter version and app version from pubspec.yaml
      - name: Show Flutter Version & App Version
        run: |
          flutter --version
          echo "App version from pubspec.yaml:"
          grep "version:" pubspec.yaml || true

      # STEP 6: Install dependencies (clean + fetch)
      - name: Install Dependencies
        run: |
          flutter clean
          flutter pub get

      # STEP 7: Fix CocoaPods conflicts (important for Firebase/Auth version mismatch)
      - name: Update CocoaPods
        run: |
          cd ios
          pod repo update                  # Update local pod specs
          pod update Firebase/Auth         # Update specific Firebase/Auth dependency
          pod install --repo-update        # Install pods with repo update
          cd ..

      # STEP 8: Show Bundle Identifier (debugging)
      - name: Show Bundle Identifier
        run: |
          plutil -p ios/Runner/Info.plist | grep CFBundleIdentifier || echo "Bundle ID not found"

      # STEP 9: Build iOS IPA (release build)
      - name: Build iOS IPA
        run: |
          flutter build ipa \
            --release \
            --export-options-plist=ios/Runner/ExportOptions.plist

      # STEP 10: List generated IPA files (for debugging)
      - name: List IPA Files
        run: ls -lh build/ios/ipa || true

      # STEP 11: Upload IPA to App Store Connect (TestFlight)
      - name: Upload to App Store Connect
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: build/ios/ipa/*.ipa
          issuer-id: ${{ secrets.APP_STORE_ISSUER_ID }}     # From Apple Developer API key
          api-key-id: ${{ secrets.APP_STORE_KEY_ID }}       # From Apple Developer API key
          api-private-key: ${{ secrets.APP_STORE_KEY_P8 }}  # Base64 of your .p8 key
