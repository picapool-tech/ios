name: Build iOS IPA and Upload to TestFlight

on:
  workflow_dispatch:
  push:
    branches: [under_dev]
    tags:     ['v*']           # v3.2.1, v3.3.0 …

jobs:
  build:
    runs-on: macos-14

    steps:
    # 1 ─ Checkout
    - uses: actions/checkout@v3

    # 2 ─ System info (debug)
    - name: Environment info
      run: |
        echo "Branch/tag → $GITHUB_REF"
        sw_vers
        xcodebuild -version

    # 3 ─ Flutter toolchain
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.32.7'

    - name: Flutter deps
      run: |
        flutter pub get
        flutter doctor -v

    # 4 ─ CocoaPods sync (handles Firebase/Auth mismatch)
    - name: CocoaPods update
      run: |
        cd ios
        pod repo update
        pod update Firebase/Auth || true
        pod install --repo-update
        cd ..

    # 5 ─ Import signing certificate & provisioning profile
    - name: Import codesign assets
      uses: apple-actions/import-codesign-certs@v2
      with:
        p12-file-base64: ${{ secrets.P12_FILE_BASE64 }}
        p12-password:    ${{ secrets.P12_PASSWORD }}
        mobileprovision: ${{ secrets.MOBILEPROVISION_BASE64 }}

    # 6 ─ Build IPA
    - name: Build release IPA
      run: |
        flutter build ipa --release \
          --export-options-plist=ios/Runner/ExportOptions.plist

    # 7 ─ Upload to TestFlight
    - name: Upload to TestFlight
      uses: apple-actions/upload-testflight-build@v1
      with:
        app-path:        build/ios/ipa/*.ipa
        issuer-id:       ${{ secrets.APP_STORE_ISSUER_ID }}
        api-key-id:      ${{ secrets.APP_STORE_KEY_ID }}
        api-private-key: ${{ secrets.APP_STORE_KEY_P8 }}
