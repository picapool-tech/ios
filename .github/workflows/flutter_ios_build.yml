name: Build iOS IPA and Upload to TestFlight

on:
  workflow_dispatch:          # Manual trigger
  push:
    branches:
      - under_dev             # Only trigger for under_dev
    tags:
      - 'v*'                  # e.g., v3.2.1

jobs:
  build:
    runs-on: macos-14          # Use stable macOS 14 runner

    steps:
      # Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Print current branch to confirm trigger
      - name: Print current branch
        run: echo "Triggered from branch: $GITHUB_REF"

      # Show system info
      - name: Show System Info
        run: |
          echo "==== SYSTEM INFO ===="
          sw_vers
          xcodebuild -version

      # Install Flutter
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.7'

      # Show Flutter and app version
      - name: Show Flutter Version & App Version
        run: |
          flutter --version
          grep "version:" pubspec.yaml || true

      # Install dependencies
      - name: Install Dependencies
        run: |
          flutter clean
          flutter pub get

      # Install CocoaPods
      - name: Update CocoaPods
        run: |
          cd ios
          pod repo update
          pod install --repo-update
          cd ..

      # Install Apple Certificates & Provisioning Profile
      - name: Install Signing Certificates
        run: |
          # Decode p12 certificate
          echo "${{ secrets.P12_FILE_BASE64 }}" | base64 --decode > ios_distribution.p12
          # Decode mobile provisioning profile
          echo "${{ secrets.MOBILEPROVISION_BASE64 }}" | base64 --decode > build.mobileprovision
          # Install p12 certificate into keychain
          security create-keychain -p "" build.keychain
          security import ios_distribution.p12 -k ~/Library/Keychains/build.keychain -P "${{ secrets.P12_PASSWORD }}" -T /usr/bin/codesign
          security list-keychains -s ~/Library/Keychains/build.keychain
          security unlock-keychain -p "" ~/Library/Keychains/build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp build.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      # Build iOS IPA
      - name: Build iOS IPA
        run: |
          flutter build ipa --release \
            --export-options-plist=ios/Runner/ExportOptions.plist

      # List IPA files
      - name: List IPA Files
        run: ls -lh build/ios/ipa || true

      # Upload to App Store Connect
      - name: Upload to App Store Connect
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: build/ios/ipa/*.ipa
          issuer-id: ${{ secrets.APP_STORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_KEY_P8 }}
