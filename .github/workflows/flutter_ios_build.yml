name: Build iOS IPA and Upload to TestFlight

on:
  workflow_dispatch:   # Allows manual trigger
  push:
    tags:
      - 'v*'           # Runs only when you push tags like v3.1.9

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'  # Change to your version

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (IPA)
        run: |
          flutter build ipa \
            --export-options-plist=ios/Runner/ExportOptions.plist \
            --release

      - name: Upload to App Store Connect
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: build/ios/ipa/*.ipa
          issuer-id: ${{ secrets.APP_STORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_KEY_P8 }}
