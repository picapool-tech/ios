name: Finally Releasing IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    env:
      P12_FILE_BASE64:        ${{ secrets.P12_FILE_BASE64 }}
      P12_PASSWORD:           ${{ secrets.P12_PASSWORD }}
      MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
      TEAM_ID:                ${{ secrets.TEAM_ID }}
      BUNDLE_ID:              ${{ secrets.BUNDLE_ID }}
      PROFILE_UUID:           23ca837c-3da0-4490-89e1-e74de0f7d55a

    steps:
      # ---------------- Checkout ----------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------- Install Flutter ----------------
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.7'

      # ---------------- iOS Dependencies ----------------
      - name: Install CocoaPods
        run: |
          set -x
          sudo gem install cocoapods xcpretty
          pod repo update

      - name: Flutter clean
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Install iOS dependencies
        run: |
          set -x
          cd ios
          cp Podfile.test Podfile
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..

      # ---------------- Signing Setup ----------------
      - name: Decode & Install Signing Assets
        run: |
          set -x
          echo "$P12_FILE_BASE64"        | base64 --decode > cert.p12
          echo "$MOBILEPROVISION_BASE64" | base64 --decode > profile.mobileprovision

          security create-keychain -p temp_pw signing.keychain
          security unlock-keychain -p temp_pw signing.keychain
          security import cert.p12 -k signing.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s signing.keychain login.keychain

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision

          echo "✅ Signing assets installed."

      - name: Debug Signing Info
        run: |
          set -x
          security find-identity -v -p codesigning
          ls -lh ~/Library/MobileDevice/Provisioning\ Profiles/

      # ---------------- Build IPA ----------------
      - name: Build IPA with Flutter
        run: |
          set -x
          export CODE_SIGN_IDENTITY=$(security find-identity -v -p codesigning | grep "Apple Distribution" | head -n 1 | cut -d '"' -f2)
          echo "Using CODE_SIGN_IDENTITY=$CODE_SIGN_IDENTITY"
          flutter build ipa \
            --release \
            --export-options-plist=ios/Runner/ExportOptions.plist

      # ---------------- Show IPA ----------------
      - name: Show IPA
        run: |
          set -x
          ls -lh build/ios/ipa || echo "IPA not generated."
